name: calrmy
description: "cAlrmy — Premium AI Alarm & Wake-up Companion"
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  google_fonts: ^6.2.1
  intl: any
  audioplayers: ^6.1.0
  shared_preferences: ^2.3.2
  http: ^1.2.2
  flutter_dotenv: ^5.2.1
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/sounds/
    - .env.example
